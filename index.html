<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт AI Playground</title>
</head>
<body>
<style>
:root{
  --bg:#F3F5F8; --paper:#FFFFFF; --fg:#151A22; --muted:#5A6474; --line:#D5DBE4; --soft:#E9EDF3; --edge:#9AA4B5;
  --accent:#2747C9;
  --ok:#1D7F55; --ok-soft:#DDF1E7; --warn:#A8670D; --warn-soft:#F8EBD3; --fail:#C0362C; --fail-soft:#FBE3E0;
  --none:#6B7486; --none-soft:#ECEEF2;
  --body:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --paper:#161C25; --fg:#E7EBF2; --muted:#9AA4B5; --line:#2C3545; --soft:#1F2632; --edge:#566175;
  --accent:#8EA4FF;
  --ok:#5FCB97; --ok-soft:#14302A; --warn:#E9AE55; --warn-soft:#33281A; --fail:#FF7B6E; --fail-soft:#3A1E1C;
  --none:#9AA3B3; --none-soft:#222A36;
 color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131A; --paper:#161C25; --fg:#E7EBF2; --muted:#9AA4B5; --line:#2C3545; --soft:#1F2632; --edge:#566175;
  --accent:#8EA4FF;
  --ok:#5FCB97; --ok-soft:#14302A; --warn:#E9AE55; --warn-soft:#33281A; --fail:#FF7B6E; --fail-soft:#3A1E1C;
  --none:#9AA3B3; --none-soft:#222A36;
 color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:clamp(24px,3.4vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
h2{margin:0 0 10px;font-size:16px;font-weight:600}

.hero{display:flex;gap:18px;align-items:center;padding:18px 20px;border-radius:14px;background:var(--paper);
  border:1px solid var(--line);border-left:8px solid var(--none)}
.hero[data-s=ok]{border-left-color:var(--ok)} .hero[data-s=warn]{border-left-color:var(--warn)} .hero[data-s=fail]{border-left-color:var(--fail)}
.hero .big{width:56px;height:56px;flex:none}
.hero p{margin:4px 0 0;color:var(--muted)}
.hero{flex-wrap:wrap}
.hero .grow{flex:1 1 220px;min-width:0}
button{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)} button:disabled{opacity:.6;cursor:default}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile .v{font-size:24px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:3px;background:var(--soft);margin:8px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter[data-s=warn] i{background:var(--warn)} .meter[data-s=fail] i{background:var(--fail)}
.counts{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.counts span{display:inline-flex;align-items:center;gap:6px;font-size:14px}

.board{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto}
svg.map{display:block;width:100%;min-width:860px;height:auto}
.g-box{fill:none;stroke:var(--line);stroke-width:1.2}
.g-box.inner{fill:var(--bg);stroke-dasharray:none}
.g-title{font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
.node{cursor:pointer}
.node rect.card{fill:var(--paper);stroke:var(--line);stroke-width:1.2}
.node[data-s=ok] rect.card{stroke:var(--ok)} .node[data-s=warn] rect.card{stroke:var(--warn);fill:var(--warn-soft)}
.node[data-s=fail] rect.card{stroke:var(--fail);fill:var(--fail-soft);stroke-width:2}
.node:hover rect.card,.node:focus rect.card{stroke-width:2.4} .node:focus{outline:none}
.node .t{font:600 13.5px var(--body);fill:var(--fg)}
.node .d{font:12px var(--body);fill:var(--muted)}
.node[data-s=fail] .halo{animation:pulse 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}
.edge.live{stroke:var(--ok);stroke-dasharray:5 7;animation:flow 1.2s linear infinite}
.edge.down{stroke:var(--fail);stroke-width:2.2;animation:blink 1s steps(1,end) infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes blink{50%{opacity:.18}}
@media (prefers-reduced-motion: reduce){.edge.live,.edge.down,.node .halo{animation:none}}
.node.sel rect.card{stroke:var(--accent);stroke-width:2.6}
.node .gear{fill:var(--muted)}

.ic{flex:none}
.ic circle{fill:var(--none)} .ic[data-s=ok] circle{fill:var(--ok)} .ic[data-s=warn] circle{fill:var(--warn)} .ic[data-s=fail] circle{fill:var(--fail)}
.ic path{fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.halo{fill:var(--fail)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--soft)}
.row:first-of-type{border-top:0}
.row b{font-weight:600} .row .m{color:var(--muted);font-size:13.5px}
.row.sel{background:var(--soft);border-radius:8px;padding-left:8px;padding-right:8px}
.row ul{margin:4px 0 0;padding:0;list-style:none}
.row li{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tag{font-size:12.5px;font-weight:600;white-space:nowrap}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.empty{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts button{padding:5px 12px;font-size:13.5px;border-radius:7px}
.acts button.go{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.acts button.stop{color:var(--fail)}
#picked{margin-top:12px;border-color:var(--accent)}
#picked[hidden]{display:none}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--fg);padding:22px;max-width:420px;font:inherit}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog h2{font-size:18px} dialog p{color:var(--muted);margin:0 0 16px}
dialog .acts{justify-content:flex-end}
.alert{display:none;margin:0 0 12px;padding:12px 16px;border-radius:10px;background:var(--fail-soft);border:1px solid var(--fail);font-weight:600}
.alert.on{display:block}
footer{margin-top:16px;color:var(--muted);font-size:13px}

.acts button:disabled{opacity:.75;cursor:not-allowed}
.snap{margin:0 0 12px;padding:10px 16px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
</style>

<div class="wrap">
  <div class="alert" id="alert" role="alert"></div>
  <p class="snap" id="snap"></p>
  <section class="hero" id="hero" data-s="none">
    <svg class="big ic" id="heroIcon" viewBox="0 0 24 24" data-s="none"></svg>
    <div class="grow">
      <div class="eyebrow">Пульт · HERZEN AI Playground</div>
      <h1 id="verdict">Загружаю состояние…</h1>
      <p id="sub"></p>
    </div>
  </section>

  <section class="tiles">
    <div class="tile"><div class="eyebrow">После перезагрузки</div><div class="v" id="up">—</div><div class="s" id="boot"></div></div>
    <div class="tile"><div class="eyebrow">Модули</div><div class="v" id="okshare">—</div><div class="counts" id="counts"></div></div>
    <div class="tile"><div class="eyebrow">Диск</div><div class="v" id="diskv">—</div><div class="meter" id="diskm"><i></i></div><div class="s" id="disks"></div></div>
    <div class="tile"><div class="eyebrow">Память</div><div class="v" id="memv">—</div><div class="meter" id="memm"><i></i></div><div class="s" id="mems"></div></div>
  </section>

  <section class="board"><svg class="map" id="map" role="img" aria-label="Схема модулей и их состояние"></svg></section>

  <section class="panel" id="picked" hidden></section>

  <section class="cols">
    <div class="panel"><h2>Требует внимания</h2><div id="issues"></div></div>
    <div class="panel"><h2>Журнал изменений</h2><div id="events"></div></div>
  </section>
  <section class="panel" style="margin-top:12px"><h2>Все модули</h2><div id="all"></div></section>
  <footer>Это неподвижный снимок. Живой пульт с кнопками управления открывается только на самом сервере. Сеть, VPN и удалённый доступ пульт не трогает.</footer>
</div>


<script>
const WORD = {ok:"Работает", warn:"Замечание", fail:"Сбой", unknown:"Неизвестно", none:"Не проверяется", off:"Остановлен", control:"Пульт"};
const ACT = {start:"Включить", stop:"Остановить", restart:"Перезапустить"};
const ACT_TEXT = {stop:"Модуль перестанет работать, пока его не включат снова или пока сервер не перезагрузится.", restart:"Модуль будет недоступен несколько секунд."};
const GLYPH = {ok:"M7 12.5l3.2 3.2L17 9", warn:"M12 6.5v7M12 17v.2", fail:"M8 8l8 8M16 8l-8 8", unknown:"M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17v.2", none:"M8 12h8", off:"M9.5 8v8M14.5 8v8"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const tone = s => s === "unknown" ? "warn" : s;
const icon = (s, size = 18) => `<svg class="ic" data-s="${tone(s)}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path d="${GLYPH[s] || GLYPH.none}"/></svg>`;
const cut = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
const num = v => v.toFixed(1).replace(".", ",");
const clock = iso => new Date(iso).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
function dur(sec){ const m = Math.floor(sec/60); if (m < 60) return m + " мин"; const h = Math.floor(m/60); return h < 48 ? `${h} ч ${m%60} мин` : `${Math.floor(h/24)} дн ${h%24} ч`; }

let MAP = null, STATUS = null, selected = null, failures = 0, busy = null;

function roundedPath(points, r = 10){
  let d = `M${points[0][0]},${points[0][1]}`;
  for (let i = 1; i < points.length - 1; i++){
    const [px,py] = points[i-1], [x,y] = points[i], [nx,ny] = points[i+1];
    const a = Math.min(r, Math.hypot(x-px, y-py)/2), b = Math.min(r, Math.hypot(nx-x, ny-y)/2);
    const ax = x - Math.sign(x-px)*a, ay = y - Math.sign(y-py)*a, bx = x + Math.sign(nx-x)*b, by = y + Math.sign(ny-y)*b;
    d += ` L${ax},${ay} Q${x},${y} ${bx},${by}`;
  }
  const last = points[points.length-1];
  return d + ` L${last[0]},${last[1]}`;
}

function drawMap(){
  if (!MAP) return;
  const st = {}; (STATUS?.nodes || []).forEach(n => st[n.id] = n);
  const svg = $("map");
  svg.setAttribute("viewBox", `0 0 ${MAP.canvas.w} ${MAP.canvas.h}`);
  let h = "";
  for (const g of MAP.groups)
    h += `<rect class="g-box${g.inner ? " inner" : ""}" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="14"/>
          <text class="g-title" x="${g.x+16}" y="${g.y+26}">${esc(g.title)}</text>`;
  for (const e of MAP.edges){
    const a = tone(st[e.from]?.status || "none"), b = tone(st[e.to]?.status || "none");
    const cls = (a === "off" || b === "off") ? "" : (a === "fail" || b === "fail") ? "down" : (a === "ok" && b === "ok") ? "live" : "";
    h += `<path class="edge ${cls}" d="${roundedPath(e.path)}"/>`;
  }
  for (const n of MAP.nodes){
    const s = st[n.id] || {status:"none", summary:"нет данных"}, w = n.w || 200, t = tone(s.status);
    const tc = Math.floor((w - 46) / 7.7), dc = Math.floor((w - 46) / 6.2);
    h += `<g class="node${selected === n.id ? " sel" : ""}" data-s="${t}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title)}: ${WORD[s.status]}, ${esc(s.summary)}">
      <title>${esc(n.title)} — ${WORD[s.status]}: ${esc(s.summary)}</title>
      <rect class="card" x="${n.x}" y="${n.y}" width="${w}" height="64" rx="10"/>
      ${t === "fail" ? `<circle class="halo" cx="${n.x+20}" cy="${n.y+32}" r="10"/>` : ""}
      <g transform="translate(${n.x+9},${n.y+21})">${icon(s.status, 22)}</g>
      <text class="t" x="${n.x+38}" y="${n.y+28}">${esc(cut(n.title, tc))}</text>
      <text class="d" x="${n.x+38}" y="${n.y+47}">${esc(cut(s.summary, dc))}</text>
      ${s.actions?.length ? `<circle class="gear" cx="${n.x+w-13}" cy="${n.y+13}" r="2"/><circle class="gear" cx="${n.x+w-20}" cy="${n.y+13}" r="2"/><circle class="gear" cx="${n.x+w-27}" cy="${n.y+13}" r="2"/>` : ""}
    </g>`;
  }
  svg.innerHTML = h;
}

function buttons(n){
  if (!n.actions?.length) return "";
  const list = n.status === "off" ? ["start"] : ["restart", "stop"];
  return `<div class="acts">${list.map(a => `<button type="button" class="${a === "stop" ? "stop" : a === "start" ? "go" : ""}" data-act="${a}" data-node="${n.id}" ${busy ? "disabled" : ""}>${busy === n.id + a ? "Выполняю…" : ACT[a]}</button>`).join("")}</div>`;
}
function nodeRow(n, withChecks){
  const checks = withChecks && n.checks.length ? `<ul>${n.checks.map(c => `<li>${icon(c.status, 14)} ${esc(c.title)}: ${esc(c.text)}</li>`).join("")}</ul>` : "";
  return `<div class="row">${icon(n.status, 20)}<div style="min-width:0;flex:1">
    <div><b>${esc(n.title)}</b> <span class="tag">· ${WORD[n.status]}</span></div>
    <div class="m">${esc(n.summary)}${n.note ? " · " + esc(n.note) : ""}</div>${checks}${buttons(n)}</div></div>`;
}

function meter(id, used, total, status){
  $(id).dataset.s = tone(status || "ok");
  $(id).firstElementChild.style.width = Math.max(2, Math.min(100, used / total * 100)) + "%";
}

function render(){
  const s = STATUS; if (!s || s.starting) return;
  const byId = {}; s.nodes.forEach(n => byId[n.id] = n);
  const bad = s.nodes.filter(n => n.status === "fail"), soft = s.nodes.filter(n => n.status === "warn" || n.status === "unknown");
  $("hero").dataset.s = s.overall;
  $("heroIcon").dataset.s = s.overall;
  $("heroIcon").innerHTML = `<circle cx="12" cy="12" r="11"/><path d="${GLYPH[s.overall]}"/>`;
  const off = s.nodes.filter(n => n.status === "off" && n.actions.length);
  $("verdict").textContent = s.overall === "ok" ? (off.length ? "Работает, часть остановлена" : "Всё работает") : s.overall === "fail" ? `Не работает: ${bad.length}` : `Есть замечания: ${soft.length}`;
  $("sub").textContent = bad.length ? bad.map(n => n.title).join(", ") : soft.length ? soft.map(n => n.title).join(", ") : off.length ? "Остановлено с пульта: " + off.map(n => n.title).join(", ") : "Все проверяемые модули отвечают.";
  document.title = (s.overall === "ok" ? "✓ " : s.overall === "fail" ? "✕ " : "! ") + "Пульт AI Playground"; document.title = "Пульт AI Playground";

  const m = s.metrics;
  $("up").textContent = m.uptime_seconds != null ? dur(m.uptime_seconds) : "—";
  $("boot").textContent = m.boot ? "Загрузка " + clock(m.boot) : "Время загрузки неизвестно";
  const checked = s.nodes.filter(n => n.status !== "none" && n.status !== "off").length;
  $("okshare").textContent = `${s.counts.ok} из ${checked}`;
  $("counts").innerHTML = ["ok","warn","fail"].map(k => {
    const c = k === "warn" ? s.counts.warn + s.counts.unknown : s.counts[k];
    return `<span>${icon(k, 16)} ${WORD[k]}: ${c}</span>`; }).join("") + (s.counts.off ? `<span>${icon("off", 16)} ${WORD.off}: ${s.counts.off}</span>` : "");
  if (m.disk){ $("diskv").textContent = `${num(m.disk.free_gb)} ГБ свободно`; $("disks").textContent = `${m.disk.name} · всего ${num(m.disk.total_gb)} ГБ`;
    meter("diskm", m.disk.total_gb - m.disk.free_gb, m.disk.total_gb, byId.disk?.status); }
  if (m.memory){ $("memv").textContent = `${num(m.memory.free_gb)} ГБ свободно`; $("mems").textContent = `всего ${num(m.memory.total_gb)} ГБ`;
    meter("memm", m.memory.total_gb - m.memory.free_gb, m.memory.total_gb, byId.mem?.status); }

  drawMap();
  const picked = byId[selected];
  $("picked").hidden = !picked;
  if (picked) $("picked").innerHTML = `<h2>Выбранный модуль</h2>` + nodeRow(picked, true);
  const issues = [...bad, ...soft];
  $("issues").innerHTML = issues.length ? issues.map(n => nodeRow(n, true)).join("") : `<p class="empty">Замечаний нет.</p>`;
  $("events").innerHTML = s.events?.length ? s.events.slice(0, 12).map(e => `<div class="row"><span class="time">${clock(e.at)}</span>
      <div style="min-width:0"><b>${esc(e.title)}</b> <span class="m">${e.to === "boot" || e.to === "control" ? "" : "→ " + WORD[e.to] + " · "}${esc(e.text)}</span></div></div>`).join("")
    : `<p class="empty">Изменений пока не было.</p>`;
  $("all").innerHTML = s.nodes.map(n => nodeRow(n, true)).join("");
}

function showAlert(text){ const a = $("alert"); a.textContent = text; a.classList.toggle("on", !!text); }

async function load(){
  try {
    const r = await fetch("/api/status", {cache:"no-store"});
    STATUS = await r.json(); failures = 0;
    const age = STATUS.generated_at ? (Date.now() - new Date(STATUS.generated_at)) / 1000 : 0;
    showAlert(STATUS.snapshot_error || (age > (STATUS.interval_seconds || 60) * 3 ? `Данные устарели: последняя проверка ${dur(age)} назад.` : ""));
    render();
  } catch (e) {
    if (++failures >= 2){ showAlert("Монитор не отвечает. Данные на странице могут быть устаревшими."); document.title = "✕ Монитор не отвечает"; }
  }
}

function pick(target){
  const g = target.closest(".node"); if (!g) return;
  selected = selected === g.dataset.id ? null : g.dataset.id; render();
  if (selected) $("picked").scrollIntoView({behavior:"smooth", block:"nearest"});
}
